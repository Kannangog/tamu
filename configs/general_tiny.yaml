# Konnon Draw General — Tiny Smoke Test Config (CPU laptop fast verify)
experiment_name: "general_tiny"
stage: 1  # Synthetic primitives
device: "cpu"

model:
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_ff: 512
  max_seq_len: 256
  dropout: 0.05

text_encoder:
  model_type: "builtin"
  d_model: 128

training:
  batch_size: 16
  learning_rate: 0.001
  min_lr: 0.0001
  weight_decay: 0.01
  max_epochs: 5
  grad_clip: 1.0
  grad_accum_steps: 1
  mixed_precision: "no"

data:
  num_synthetic: 600
  max_quickdraw_per_class: 50
  val_split: 0.15
  num_workers: 0

checkpoints:
  out_dir: "outputs_general/tiny/checkpoints"
  save_every: 1
