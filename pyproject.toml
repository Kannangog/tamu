[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konnon-drawing-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "pillow",
    "matplotlib",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]
